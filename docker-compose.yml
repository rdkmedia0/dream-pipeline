services:
  dream-pipeline:
    # Pulled from GHCR, never built locally -- `docker compose pull && docker
    # compose up -d` is the whole install. See docker-publish.sh (repo root)
    # for how a new version actually gets published there; that's a
    # maintainer step, not something an end user ever needs to run.
    image: ghcr.io/rdkmedia0/dream-pipeline:latest
    ports:
      # Bound to 127.0.0.1 on the HOST side deliberately -- web_ui.py's
      # whole design is "no auth, single local user" (see its own
      # module docstring). Docker's network isolation is what makes
      # --host 0.0.0.0 safe INSIDE the container, but publishing that to
      # every host interface (a bare "8420:8420") would undo the exact
      # protection this app was built around. Host port is the only
      # thing meant to vary per machine -- override with a .env file or
      # `WEB_UI_PORT=9000 docker compose up`.
      - "127.0.0.1:${WEB_UI_PORT:-8420}:8420"
    volumes:
      # Host paths default to ./data and ./state (created next to this
      # file) so a fresh `docker compose up` works out of the box for
      # anyone pulling the distributable image -- override via .env or
      # `DREAM_PIPELINE_DATA_DIR=/srv/... DREAM_PIPELINE_STATE_DIR=/srv/...
      # docker compose up` for a real deployment. See .env.example.
      #
      # Rendered videos, keyframes, specs, index.json, CREATIVE.md, etc.
      # (config.json's projects_root points here, set by entrypoint.sh
      # on first run).
      - ${DREAM_PIPELINE_DATA_DIR:-./data}:/data
      # config.json + the YouTube OAuth Fernet key/secrets -- kept out
      # of the image and off the projects volume so a redistributed
      # image never carries them.
      - ${DREAM_PIPELINE_STATE_DIR:-./state}:/state
    environment:
      # Optional -- config.json's ollama_url/comfyui_url can still be set
      # (or overridden) via the Settings screen after the container's up;
      # these just save doing that by hand on every fresh install. Applied
      # by entrypoint.sh on every container start, so editing these and
      # restarting always takes effect. Leave unset (or delete these two
      # lines) to configure entirely through Settings instead -- neither
      # has a default here, on purpose, so an unset one is left alone
      # rather than getting written as an empty string.
      #
      # The Gemini API key has NO env var here, deliberately -- unlike
      # these two plain URLs, it's a real secret, stored encrypted at
      # rest (see secret_store.py) rather than in config.json; putting it
      # in this file would mean the raw key sits in cleartext in
      # docker-compose.yml/.env instead. Paste it once in Settings > Gemini.
      - OLLAMA_URL=${OLLAMA_URL:-}
      - COMFYUI_URL=${COMFYUI_URL:-}
      # Same idea, for the "complete" profile below -- see
      # load_config()'s own comment on why BOTH need to be set
      # explicitly the moment more than one Ollama model exists, rather
      # than relying on its single-model auto-detect fallback.
      - CREATIVE_MODEL=${CREATIVE_MODEL:-}
      - VISION_MODEL=${VISION_MODEL:-}
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # "Complete" profile -- bundles Ollama + ComfyUI + two known-working
  # default models (see README's own "Tested models" table) as sibling
  # containers, so a fresh machine goes from zero to a fully working
  # setup with one command instead of installing/configuring each piece
  # by hand. NOT started by a bare `docker compose up` -- opt in with
  # `docker compose --profile complete up -d`, or use run_complete.sh /
  # run_complete.bat, which set the right OLLAMA_URL/COMFYUI_URL/
  # CREATIVE_MODEL/VISION_MODEL values above automatically so dream-pipeline
  # finds these services with zero manual Settings entry.
  #
  # Deliberately NOT baked into dream-pipeline's own image -- see the
  # README's licensing note: Ollama is MIT (fine to redistribute), but
  # ComfyUI is GPL-3.0 and each Ollama MODEL has its own separate
  # license, so these are pulled directly from their own publishers at
  # deploy time (ollama/ollama on Docker Hub, mmartial/comfyui-nvidia-docker,
  # and whatever models Ollama itself pulls from its own registry) rather
  # than redistributed inside an image this repo controls.
  #
  # Requires the NVIDIA Container Toolkit on the host (same GPU
  # requirement the "lite" setup already has for a REMOTE ComfyUI -- this
  # profile just also runs that GPU workload in a container on this same
  # machine instead of talking to one elsewhere).
  ollama:
    image: ollama/ollama:latest
    profiles: ["complete"]
    volumes:
      - ${DREAM_PIPELINE_OLLAMA_DIR:-./ollama-data}:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the two default models (see README's "Tested models"
  # table for why these two specifically) once Ollama is actually up,
  # then exits -- `ollama pull` is a no-op if a model's already present,
  # so this is safe to leave running every `docker compose up` without
  # re-downloading anything after the first time.
  #
  # Expected download size (checked against a live Ollama instance):
  #   gemma4:12b   ~7.6 GB
  #   qwen3-vl:8b  ~6.1 GB
  #   -----------------------
  #   total        ~13.7 GB  (one-time, first `docker compose --profile
  #                complete up` only -- plus the ollama/ollama and
  #                mmartial/comfyui-nvidia-docker base images below)
  #
  # To use different models instead of these defaults, override
  # CREATIVE_MODEL / VISION_MODEL in your .env (see .env.example) --
  # any tag in Ollama's library works, just note its own download size.
  ollama-model-init:
    image: ollama/ollama:latest
    profiles: ["complete"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - "ollama pull ${CREATIVE_MODEL:-gemma4:12b} && ollama pull ${VISION_MODEL:-qwen3-vl:8b}"
    restart: "no"

  # One-shot: downloads the checkpoint set our default workflow
  # (workflow_api_fml2v.json) actually needs to run, straight from each
  # file's own publisher (Hugging Face -- never bundled/redistributed by
  # this repo, same reasoning as the "complete" profile's own comment
  # above). Writes directly into comfyui's `basedir` volume, so it only
  # needs that volume mounted -- doesn't wait on the comfyui service
  # itself being up. `curl -C -` resumes/skips already-complete files,
  # so re-running `docker compose --profile complete up` is safe and
  # doesn't re-download anything after the first time.
  #
  # Expected download size (from install_manifest.py's own tracked
  # sizes for these files):
  #   diffusion model (COMFYUI_CHECKPOINT_URL)    ~23 GB
  #   text encoder    (COMFYUI_TEXT_ENCODER_URL)  ~13.2 GB
  #   vae / upscaler companions (fixed, small)     ~2 GB (untracked exact size)
  #   -----------------------------------------------------
  #   total                                        ~38 GB  (one-time)
  #
  # Override COMFYUI_CHECKPOINT_URL / COMFYUI_TEXT_ENCODER_URL in your
  # .env (see .env.example) to point at a different checkpoint/text
  # encoder instead of our tested default -- e.g. to use one of the
  # OTHER workflow_api_*.json files' models instead (fp8_t2v, i2v,
  # t2i_i2i -- see install_manifest.py for their filenames/sources).
  # Swapping either URL means also switching which workflow Settings is
  # configured to use, same as changing CREATIVE_MODEL/VISION_MODEL
  # above requires those models to actually be pulled.
  comfyui-model-init:
    image: curlimages/curl:latest
    profiles: ["complete"]
    user: "${WANTED_UID:-1000}:${WANTED_GID:-1000}"
    volumes:
      - ${DREAM_PIPELINE_COMFYUI_DATA_DIR:-./comfyui-data}:/basedir
    environment:
      - COMFYUI_CHECKPOINT_URL=${COMFYUI_CHECKPOINT_URL:-https://huggingface.co/Kijai/LTX2.3_comfy/resolve/main/diffusion_models/ltx-2.3-22b-distilled-1.1_transformer_only_fp8_scaled.safetensors}
      - COMFYUI_TEXT_ENCODER_URL=${COMFYUI_TEXT_ENCODER_URL:-https://huggingface.co/Comfy-Org/ltx-2/resolve/main/split_files/text_encoders/gemma_3_12B_it_fp8_scaled.safetensors}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /basedir/models/diffusion_models /basedir/models/text_encoders /basedir/models/vae /basedir/models/latent_upscale_models
        fetch() { out="$$1"; url="$$2"; [ -s "$$out" ] || curl -fL -C - -o "$$out" "$$url"; }
        fetch "/basedir/models/diffusion_models/$$(basename "$$COMFYUI_CHECKPOINT_URL")" "$$COMFYUI_CHECKPOINT_URL"
        fetch "/basedir/models/text_encoders/$$(basename "$$COMFYUI_TEXT_ENCODER_URL")" "$$COMFYUI_TEXT_ENCODER_URL"
        fetch "/basedir/models/vae/LTX23_video_vae_bf16.safetensors" "https://huggingface.co/Kijai/LTX2.3_comfy/resolve/main/vae/LTX23_video_vae_bf16.safetensors"
        fetch "/basedir/models/vae/LTX23_audio_vae_bf16.safetensors" "https://huggingface.co/Kijai/LTX2.3_comfy/resolve/main/vae/LTX23_audio_vae_bf16.safetensors"
        fetch "/basedir/models/vae/taeltx2_3.safetensors" "https://huggingface.co/Kijai/LTX2.3_comfy/resolve/main/vae/taeltx2_3.safetensors"
        fetch "/basedir/models/latent_upscale_models/ltx-2.3-spatial-upscaler-x2-1.1.safetensors" "https://huggingface.co/Lightricks/LTX-2.3/resolve/main/ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
    restart: "no"

  comfyui:
    image: mmartial/comfyui-nvidia-docker:latest
    profiles: ["complete"]
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      # Split the same way the image's own compose.yaml does: `run/`
      # holds the container's working files (safe to wipe/regenerate on
      # upgrade), `basedir/` holds actual models/input/output/user data
      # you don't want to lose.
      - ${DREAM_PIPELINE_COMFYUI_RUN_DIR:-./comfyui-run}:/comfy/mnt
      - ${DREAM_PIPELINE_COMFYUI_DATA_DIR:-./comfyui-data}:/basedir
    environment:
      - WANTED_UID=${WANTED_UID:-1000}
      - WANTED_GID=${WANTED_GID:-1000}
      - BASE_DIRECTORY=/basedir
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
