services:
  dream-pipeline:
    # Pulled from GHCR, never built locally -- `docker compose pull && docker
    # compose up -d` is the whole install. See docker-publish.sh (repo root)
    # for how a new version actually gets published there; that's a
    # maintainer step, not something an end user ever needs to run.
    image: ghcr.io/rdkmedia0/dream-pipeline:latest
    ports:
      # Bound to 127.0.0.1 on the HOST side deliberately -- web_ui.py's
      # whole design is "no auth, single local user" (see its own
      # module docstring). Docker's network isolation is what makes
      # --host 0.0.0.0 safe INSIDE the container, but publishing that to
      # every host interface (a bare "8420:8420") would undo the exact
      # protection this app was built around. Host port is the only
      # thing meant to vary per machine -- override with a .env file or
      # `WEB_UI_PORT=9000 docker compose up`.
      - "127.0.0.1:${WEB_UI_PORT:-8420}:8420"
    volumes:
      # Host paths default to ./data and ./state (created next to this
      # file) so a fresh `docker compose up` works out of the box for
      # anyone pulling the distributable image -- override via .env or
      # `DREAM_PIPELINE_DATA_DIR=/srv/... DREAM_PIPELINE_STATE_DIR=/srv/...
      # docker compose up` for a real deployment. See .env.example.
      #
      # Rendered videos, keyframes, specs, index.json, CREATIVE.md, etc.
      # (config.json's projects_root points here, set by entrypoint.sh
      # on first run).
      - ${DREAM_PIPELINE_DATA_DIR:-./data}:/data
      # config.json + the YouTube OAuth Fernet key/secrets -- kept out
      # of the image and off the projects volume so a redistributed
      # image never carries them.
      - ${DREAM_PIPELINE_STATE_DIR:-./state}:/state
    restart: unless-stopped
